services:
  ali_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ali_app
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_ADMIN_USERNAME=${TELEGRAM_ADMIN_USERNAME}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - PROXY_LEASE_SIZE=${HARVEST_LEASE:-5}
      - WEB_APP_URL=${WEB_APP_URL}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_FIRESTORE_DATABASE_ID=${FIREBASE_FIRESTORE_DATABASE_ID:-}
      - LEGACY_AES_PASSWORD=${LEGACY_AES_PASSWORD:-}
    volumes:
      - ali-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  ali_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: ali_bot
    restart: always
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_ADMIN_USERNAME=${TELEGRAM_ADMIN_USERNAME}
      - WEB_APP_URL=${WEB_APP_URL}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - TELEGRAM_PROXY_CHECK_MS=${TELEGRAM_PROXY_CHECK_MS:-60000}
      - PROXY_LEASE_SIZE=${HARVEST_LEASE:-5}
      - BOT_USE_PROXY=${BOT_USE_PROXY:-0}
      - GAME_SERVER_URL=http://ali_app:3000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      - DATA_DIR=/app/data
    depends_on:
      ali_app:
        condition: service_healthy
    volumes:
      - ali-data:/app/data
    security_opt:
      - no-new-privileges:true

  ali_proxy:
    build:
      context: ./proxy-harvester
      dockerfile: Dockerfile
    container_name: ali_proxy
    restart: always
    environment:
      - NODE_ENV=production
      - PROXY_DATA_DIR=/app/data
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - HARVEST_INTERVAL_MS=${HARVEST_INTERVAL_MS:-600000}
      - HARVEST_CONCURRENCY=${HARVEST_CONCURRENCY:-120}
      - HARVEST_TIMEOUT_MS=${HARVEST_TIMEOUT_MS:-10000}
      - HARVEST_TARGET=${HARVEST_TARGET:-18}
      - HARVEST_MIN_RESERVE=${HARVEST_MIN_RESERVE:-15}
      - HARVEST_MAX=${HARVEST_MAX:-20}
      - HARVEST_LEASE=${HARVEST_LEASE:-5}
    volumes:
      - ali-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  ali-data:
